name: Verify and Sign Manifest

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/offline_manifest.json'
  push:
    branches: [main]
    paths:
      - 'config/offline_manifest.json'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install packaging jsonschema

      - name: Extract previous manifest
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="HEAD~1"
          fi
          if git cat-file -e "${BASE_REF}:config/offline_manifest.json" 2>/dev/null; then
            git show "${BASE_REF}:config/offline_manifest.json" > /tmp/base_manifest.json
            echo "BASE_ARG=--base /tmp/base_manifest.json" >> $GITHUB_ENV
          fi

      - name: Verify schema, links, sizes, hashes, and version bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/verify_manifest.py config/offline_manifest.json $BASE_ARG

  sign:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cryptography
        run: pip install cryptography

      - name: Create .sig file
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.PRIVATE_SECRET_KEY_FOR_SIGNING_FILES_REQUIRED_BY_AGENT }}
        run: |
          python .github/scripts/sign.py config/offline_manifest.json config/offline_manifest.json.sig

      - name: Commit and push .sig file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/offline_manifest.json.sig
          git commit -m "Auto-update signature for offline_manifest.json [skip ci]" || echo "No changes to commit"
          git push
